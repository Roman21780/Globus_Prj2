databaseChangeLog:
  - changeSet:
      id: 002-create-exchange-rates
      author: developer
      changes:
        - createSequence:
            sequenceName: exchange_rates_id_seq
            startValue: 1
            incrementBy: 1
        - createTable:
            tableName: exchange_rates
            columns:
              - column:
                  name: id
                  type: bigint
                  defaultValueSequenceNext: exchange_rates_id_seq
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: varchar(10)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: rate
                  type: numeric(10, 4)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
